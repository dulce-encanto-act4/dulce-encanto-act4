<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="es" lang="es">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Dulce Encanto - Pedidos</title>
</head>

<body>

    <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="pedidos.html">Pedidos</a></li>
        <li><a href="contacto.html">Contacto</a></li>
    </ul>

    <h1>Haz tu pedido</h1>

    <p>Déjanos tus datos y te escribimos para confirmar tu pedido.</p>

    <form action="https://api.web3forms.com/submit" method="post">

        <fieldset>
            <legend>Datos del pedido</legend>

            <input type="hidden" name="access_key" value="23f0bf48-0ea3-494c-afff-1ce72d8f94fb" />
            <input type="hidden" name="subject" value="Pedido - Dulce Encanto" />

            <p>
                <label for="nom">Nombre:</label>
                <input type="text" id="nom" name="nombre"
                size="30" maxlength="50" required="required" />
            </p>

            <p>
                <label for="cor">Correo:</label>
                <input type="text" id="cor" name="correo"
                size="30" required="required" />
            </p>

            <p>
                <label for="prod">Producto:</label>
                <select id="prod" name="producto">
                    <option value="torta">Torta</option>
                    <option value="galletas" selected="selected">Galletas decoradas</option>
                    <option value="postres">Postres individuales</option>
                </select>
            </p>

            <p>
                Entrega:
                <input type="radio" id="ret" name="entrega"
                value="retiro" checked="checked" />
                <label for="ret">Retiro en tienda</label>

                <input type="radio" id="dom" name="entrega"
                value="domicilio" />
                <label for="dom">A domicilio</label>
            </p>

            <p>
                <input type="checkbox" id="tar" name="tarjeta" value="si" />
                <label for="tar">Incluir tarjeta con mensaje</label>
            </p>

            <p>
                <label for="msg">Mensaje:</label><br />
                <textarea id="msg" name="mensaje" rows="3" cols="30"></textarea>
            </p>

        </fieldset>

        <p>
            <input type="submit" value="Enviar pedido" />
            <input type="reset" value="Borrar" />
        </p>

    </form>

</body>
</html>
